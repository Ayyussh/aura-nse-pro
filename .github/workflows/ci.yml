name: "AURA CI/CD Pipeline: Continuous Testing & Validation"

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: "Python 3.11 Backend Tests & Integrity Gate"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Backend Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: "Initialize SQLite WAL Database & Seed Vault"
        run: |
          python -m backend.db.init_db

      - name: "Execute Comprehensive Test Suite (Milestones 2, 3, 4, 5, 6, 17, and Self-Improving ML)"
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          pytest -v --tb=short

      - name: "Run Upstox Smoke Test"
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python scripts/upstox_smoke_test.py

  frontend-build:
    name: "React 19 + TypeScript Frontend Verification"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Install Frontend Dependencies"
        working-directory: frontend
        run: npm ci

      - name: "Compile & Build Production Bundle"
        working-directory: frontend
        run: npm run build
