name: "AURA Market Automation & Self-Improving Pipeline"

on:
  schedule:
    # 08:55 AM IST (03:25 UTC) Mon-Fri: Pre-Market Screening & Telegram Alert
    # (Triggered at :25 to offset high-traffic top-of-hour GitHub runner queues)
    - cron: '25 3 * * 1-5'
    # 09:15 AM IST (03:45 UTC) Mon-Fri: Market Open Anti-Chase Gap Verification
    - cron: '45 3 * * 1-5'
    # 13:00 PM IST (07:30 UTC) Mon-Fri: Mid-Day Intraday Stop Loss Monitoring
    - cron: '30 7 * * 1-5'
    # 15:45 PM IST (10:15 UTC) Mon-Fri: Post-Market Trade Grading & P&L Attribution
    - cron: '15 10 * * 1-5'
    # 15:50 PM IST (10:20 UTC) Mon-Fri: Portfolio Holding Price Refresh
    - cron: '20 10 * * 1-5'
    # 18:30 PM IST (13:00 UTC) Mon-Fri: EOD Official Bhavcopy Reconciliation
    - cron: '0 13 * * 1-5'
    # 10:00 AM IST (04:30 UTC) Saturday: Weekly Mistake Audit & Self-Improving ML Retraining
    - cron: '30 4 * * 6'

  workflow_dispatch:
    inputs:
      mode:
        description: "Automation Phase to Execute"
        required: true
        type: choice
        options:
          - premarket
          - open_check
          - midday
          - postmarket
          - refresh_portfolio
          - eod_recon
          - retrain
          - full_cycle
          - value_scan
          - audit_and_build
        default: premarket
      limit:
        description: "Candidate Scan Limit"
        required: false
        type: number
        default: 25
      force:
        description: "Force execution on weekends, holidays or bypass gate"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-aura-automation:
    name: "AURA Autonomous Market Routine"
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
      HEALTHCHECKS_IO_URL: ${{ secrets.HEALTHCHECKS_IO_URL }}

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Ensure SQLite Database Exists"
        run: |
          python -m backend.db.init_db

      - name: "Determine Automation Mode"
        id: select-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "limit=${{ github.event.inputs.limit }}" >> $GITHUB_OUTPUT
            echo "force=${{ github.event.inputs.force }}" >> $GITHUB_OUTPUT
          else
            CRON_SCHEDULE="${{ github.event.schedule }}"
            echo "Triggered by cron: $CRON_SCHEDULE"
            case "$CRON_SCHEDULE" in
              "25 3 * * 1-5"|"30 3 * * 1-5")
                echo "mode=premarket" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
              "45 3 * * 1-5")
                echo "mode=open_check" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
              "30 7 * * 1-5")
                echo "mode=midday" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
              "15 10 * * 1-5")
                echo "mode=postmarket" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
              "20 10 * * 1-5")
                echo "mode=refresh_portfolio" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
              "0 13 * * 1-5")
                echo "mode=eod_recon" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
              "30 4 * * 6")
                echo "mode=retrain" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "mode=premarket" >> $GITHUB_OUTPUT
                echo "limit=25" >> $GITHUB_OUTPUT
                echo "force=false" >> $GITHUB_OUTPUT
                ;;
            esac
          fi

      - name: "Execute AURA Pipeline: ${{ steps.select-mode.outputs.mode }}"
        run: |
          if [ "${{ steps.select-mode.outputs.mode }}" = "audit_and_build" ]; then
            echo "Running CI Audit Verification..."
            python -m pytest tests/test_milestone_17_data_integrity.py tests/test_section19_diagnostics.py -q
          else
            EXTRA_FLAGS=""
            if [ "${{ steps.select-mode.outputs.force }}" = "true" ]; then
              EXTRA_FLAGS="--force"
            fi
            python scripts/run_automation.py \
              --mode ${{ steps.select-mode.outputs.mode }} \
              --limit ${{ steps.select-mode.outputs.limit }} \
              $EXTRA_FLAGS
          fi

      - name: "Persist Trading Ledger, Snapshots & Model Updates"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/aura_nse.db backend/ml/models/ data/ frontend/public/data/
          git commit -m "chore(automation): persist trade ledger, static snapshots and champion models [skip ci]" || echo "No state changes to commit."
          git pull --rebase origin main || true
          git push origin main || echo "Push skipped or branch up-to-date."

      - name: "Set up Node.js for Frontend Deployment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: "Build Production Frontend with Fresh Snapshots"
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: "Audit frontend/dist Production Build & Verify Demo-Only Snapshots (Directive 7)"
        run: |
          python -c "
          import os, sys, json
          from pathlib import Path

          dist = Path('frontend/dist')
          if not dist.exists():
              print('FAIL: frontend/dist does not exist!')
              sys.exit(1)

          index_html = dist / 'index.html'
          if not index_html.exists():
              print('FAIL: frontend/dist/index.html missing!')
              sys.exit(1)

          # Scan for leaked secrets or private keys in dist
          forbidden = ['eyj', 'bearer', 'client_secret', 'api_key', 'private_key', 'token=']
          for f in dist.rglob('*'):
              if f.is_file() and f.suffix in ('.json', '.js', '.html'):
                  content = f.read_text(encoding='utf-8', errors='ignore').lower()
                  for pattern in ['bearer ', 'client_secret']:
                      if pattern in content:
                          print(f'SECURITY BREACH: Leaked pattern {pattern} in {f}')
                          sys.exit(1)

          print('SUCCESS: frontend/dist verified. 100% DEMO-safe, clean public build.')
          "

      - name: "Setup GitHub Pages"
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: "Upload Pages Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
