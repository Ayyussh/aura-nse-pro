name: "Verify Upstox Data Connection"

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/data/upstox.py'
      - 'scripts/upstox_smoke_test.py'
      - '.github/workflows/verify_upstox.yml'

jobs:
  test-upstox-connectivity:
    name: "Live Upstox API Data Verification"
    runs-on: ubuntu-latest

    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: "Initialize Database"
        run: |
          python -m backend.db.init_db

      - name: "Run Upstox Smoke Test"
        run: |
          python scripts/upstox_smoke_test.py

      - name: "Run Upstox Rate Limiter & Charges Comparison Tests"
        run: |
          pytest -v tests/test_upstox_multi_tier_limiter.py tests/test_upstox_charges_comparison.py
