# AURA-NSE Pro Strategy Configuration
# Version: 1.0.0 (Effective 2026-11-13)
# All strategy, screening, risk, ML, and readiness thresholds live here.

version: "1.0.0"
updated_at: "2026-11-13T17:30:00+05:30"

universe:
  default_index: "NIFTY_500"
  min_price: 50.0
  min_20d_avg_volume: 500000
  min_20d_avg_turnover_cr: 5.0
  max_qty_pct_of_20d_vol: 1.0
  exclude_series: ["BE", "BZ", "SM", "ST"]
  exclude_gsm_asm: true
  min_listing_days: 250

swing_strategy:
  trend:
    ema_fast: 50
    sma_slow: 200
  adx:
    period: 14
    min_threshold: 20.0
  rsi:
    period: 14
    min_threshold: 50.0
    max_threshold: 70.0
  macd:
    fast: 12
    slow: 26
    signal: 9
  volume:
    sma_period: 20
    min_volume_ratio: 1.2
  relative_strength:
    benchmark: "^NSEI"
    period: 20
  risk_reward:
    atr_period: 14
    stop_atr_mult: 2.0
    target_atr_mult: 4.0
    max_stop_distance_pct: 8.0
    min_net_rr_ratio: 1.8
    default_time_limit_days: 10
    min_time_limit_days: 5
    max_time_limit_days: 15
  anti_chase:
    ema_period: 20
    max_chase_atr_ratio: 2.5
  delivery:
    require_above_avg: false

long_term_strategy:
  market_cap_min_cr: 2000.0
  roe_min_pct: 15.0
  roce_min_pct: 15.0
  debt_to_equity_max: 0.8
  interest_coverage_min: 3.0
  pe_max_cap: 35.0
  pe_median_history_mult: 1.3
  pe_sector_median_mult: 1.3
  rev_growth_yoy_min_pct: 10.0
  pat_growth_yoy_min_pct: 12.0
  cfo_pat_ratio_min: 0.8
  fcf_positive_years_min: 3
  piotroski_f_min: 6
  max_promoter_pledge_pct: 10.0
  max_promoter_holding_drop_4q_pts: 3.0
  banking_nbfc:
    roa_min_pct: 1.2
    gnpa_max_pct: 3.0
    nim_min_pct: 3.0
    casa_min_pct: 35.0
    car_min_pct: 14.0
  portfolio_allocation:
    target_weight_pct: 5.0
    max_holdings: 20
    max_sector_weight_pct: 20.0
    tranches: 3

macro_regime:
  nifty_trend_emas: [20, 50, 200]
  vix_amber_threshold: 18.0
  vix_red_threshold: 24.0
  breadth_50dma_amber_threshold: 50.0
  breadth_50dma_red_threshold: 30.0
  consecutive_days_to_shift: 2
  sizing_multipliers:
    green: 1.0
    amber: 0.5
    red: 0.0

ml_engine:
  min_probability_threshold: 0.45
  min_ev_r_threshold: 0.20
  target_r: 2.0
  stop_r: 1.0
  embargo_days: 15
  cv_splits: 5
  confidence_level: 0.95
  champion_metric: "brier_score"

risk_guard:
  default_capital: 100000.0
  default_risk_per_trade_pct: 1.5
  max_position_capital_pct: 20.0
  max_concurrent_swing_positions: 5
  max_open_trades_per_sector: 2
  max_sector_exposure_pct: 30.0
  max_portfolio_heat_pct: 6.0
  max_correlation_threshold: 0.80
  drawdown_breaker_8pct_halve: true
  drawdown_breaker_12pct_pause: true
  consecutive_losses_halve_count: 4

guardrails:
  earnings_window_trading_days: 5
  earnings_unknown_policy: "HALF_SIZE" # or "SKIP"
  gap_up_skip_pct: 2.5
  gap_down_skip_stop_pct: 0.0

readiness_scorecard:
  min_shadow_weeks: 8
  min_shadow_trades: 30
  min_net_expectancy_r: 0.15
  min_ci_lower_bound_r: 0.00
  max_drawdown_pct: 10.0
  min_edge_over_same_exposure_benchmark_r: 0.05
  min_edge_over_random_placebo_r: 0.10
  max_brier_score: 0.24
  max_calibration_error: 0.08
  max_unresolved_data_incidents: 0
  min_historical_trades: 100
  min_live_paper_trades: 30
