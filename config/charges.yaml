# Indian Statutory & Brokerage Charges Schedule
# Validated as of: 2026-11-13 (Post Budget 2026 verification)
# Effective for Cash / Delivery & Swing Trades

version: "2026.11"
verified_on: "2026-11-13"
effective_date: "2026-11-13"

rates:
  stt:
    delivery_buy_rate: 0.001   # 0.1% on Buy Turnover
    delivery_sell_rate: 0.001  # 0.1% on Sell Turnover
  stamp_duty:
    buy_rate: 0.00015          # 0.015% on Buy Turnover only
    sell_rate: 0.0
  exchange_txn_charge:
    nse_rate: 0.0000345        # ~0.00345% of total turnover
    bse_rate: 0.0000375
  sebi_turnover_fee:
    rate_per_crore: 10.0       # ₹10 per crore (0.0001%)
  gst:
    rate: 0.18                 # 18% on (Brokerage + Txn Charges + SEBI Fee)
    applies_to_stt: false
    applies_to_stamp_duty: false
  dp_charges:
    flat_per_sell_scrip: 13.50 # Base DP charge before GST
    gst_rate: 0.18             # 18% GST -> Total = ₹15.93 per scrip sell day

broker_profiles:
  zero_brokerage_delivery:
    name: "Zero Brokerage Discount Broker (e.g. Zerodha/Groww/Angel)"
    delivery_brokerage_buy: 0.0
    delivery_brokerage_sell: 0.0
    flat_order_fee: 0.0
  flat_20_delivery:
    name: "Flat ₹20 per Executed Order"
    delivery_brokerage_buy: 20.0
    delivery_brokerage_sell: 20.0
    flat_order_fee: 20.0
  upstox_delivery:
    name: "Upstox Standard Delivery (Flat ₹20 per executed order)"
    delivery_brokerage_buy: 20.0
    delivery_brokerage_sell: 20.0
    flat_order_fee: 20.0
  traditional_percentage:
    name: "Traditional Percentage Broker (0.1% or min ₹25)"
    percentage_rate: 0.001
    min_brokerage: 25.0

default_broker_profile: "zero_brokerage_delivery"

slippage_model:
  large_cap_bps: 5.0   # 0.05% per side
  mid_cap_bps: 10.0    # 0.10% per side
  small_cap_bps: 20.0  # 0.20% per side
